#SPRING DATA-SOURCE CONFIG
spring.datasource.platform = h2
spring.datasource.url = ${DETMAKER_CONNECTION}
spring.datasource.username = ${DETMAKER_USUARIO}
spring.datasource.password = ${DETMAKER_PASSWORD}
spring.datasource.driver-class-name = org.h2.Driver
server.port = 1990

#SPRING JPA CONFIG
spring.jpa.database = H2
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.H2Dialect
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.generate-ddl = true
spring.jpa.hibernate.ddl-auto = update
spring.jooq.sql-dialect = true

#SPRING ERRORS CONFIG
server.error.include-stacktrace = never
server.error.include-exception = false
#!server.error.include-binding-errors = never


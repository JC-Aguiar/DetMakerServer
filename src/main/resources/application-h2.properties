#SPRING DATA-SOURCE CONFIG
spring.datasource.platform = h2
spring.datasource.url = ${DETMAKER_CONNECTION}
spring.datasource.username = ${DETMAKER_USUARIO}
spring.datasource.password = ${DETMAKER_PASSWORD}
spring.datasource.driver-class-name = org.h2.Driver
spring.datasource.hikari.connection-init-sql = ALTER SESSION SET NLS_LANGUAGE='AMERICAN' NLS_TERRITORY='AMERICA' NLS_CHARACTERSET='AL32UTF8'
server.port = 1990

#SPRING JPA CONFIG
spring.jpa.database = H2
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.H2Dialect
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.generate-ddl = true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.connection.charSet = UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding = UTF-8
spring.jpa.properties.hibernate.connection.useUnicode = true
spring.jooq.sql-dialect = true

#SPRING ERRORS CONFIG
server.error.include-stacktrace = never
server.error.include-exception = false
#!server.error.include-binding-errors = never

#SPRING FRAMEWORK CONFIG
spring.main.allow-circular-references=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
